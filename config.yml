# Router runtime config template for M2.
# Publish this file from the Aptos-owned router config release repo, then put
# its immutable raw URL@sha256:<hex> into both -i and -u in vm-router-prod.yml.
#
# host1 is the public router endpoint; host0 remains the direct GLM backend
# throughout M2 and is never changed by the router deployment.
models:
  glm-5-3:
    repo: aptos-labs/confidential-glm-5-3-prod
    enclaves:
      - host0.inference.aptoslabs.com
