# Test-only router config for the rehearsal windows.
# Not a production config; production remains v0.0.1 (glm-5-3 -> host0).
#
# Rehearsal backends (single-window cutover plan, option B):
#   - qwen3-8-27b: fast pre-check backend (~30min boot). Serves on the
#     host0 name during the window (GLM down; HAProxy host0 SNI -> 8443 ->
#     the Qwen debug CVM), same as the 2026-09-03 smoke. Measurements in
#     aptos-labs/confidential-qwen3-8-27b-debug (v0.0.5+ = post-#854 sync).
#   - glm-5-3: full-fidelity rehearsal backend (vm-glm-5.3-debug-finalform
#     in aptos-labs/atlas). Serves on the dedicated rehearsal name
#     glm-debug.inference.aptoslabs.com (DNS A record + HAProxy SNI -> 8445,
#     provisioned pre-window). Measurements in
#     aptos-labs/confidential-glm-5-3-debug (v0.0.1+).
models:
  qwen3-8-27b:
    repo: aptos-labs/confidential-qwen3-8-27b-debug
    enclaves:
      - host0.inference.aptoslabs.com
  glm-5-3:
    repo: aptos-labs/confidential-glm-5-3-debug
    enclaves:
      - glm-debug.inference.aptoslabs.com
