cvm-version: 0.11.0
shim:
  upstream-container: router
  upstream-port: 8089
  paths:
  - /v1/chat/completions
  - /v1/completions
  - /v1/embeddings
  - /v1/models
  - /v1/videos/sync
  - /health
  - /metrics
  - /source
  - /
  dummy-attestation: false
  publish-attestation: false
  authenticated: true
  authenticated-endpoints:
  - /v1/chat/completions
  - /v1/completions
  - /v1/embeddings
  - /v1/models
  - /v1/videos/sync
  - /metrics
  tls-mode: cert-proxy
  tls-challenge: dns
  tls-own-san-domain: true
  control-plane: https://api.inference.aptoslabs.com/
  atc: https://atc.inference.aptoslabs.com
cvm-network:
  inbound-ports:
  - 443
networks:
  router-egress:
    egress: allowlist
    allow:
    - raw.githubusercontent.com
    - github-proxy.tinfoil.sh
    - tuf-repo-cdn.sigstore.dev
    - api.inference.aptoslabs.com
    - host0.inference.aptoslabs.com
    - host1.inference.aptoslabs.com
cpus: 8
memory: 16384
gpus: 0
models: []
containers:
- name: router
  image: ghcr.io/aptos-labs/confidential-model-router@sha256:3d2cec57acf290981a27a7d966d8483dc0ad0afddba69d34cb0b76c2994b4faf
  ipc: private
  restart: always
  networks:
  - router-egress
  command:
  - -l=8089
  - -C=https://api.inference.aptoslabs.com/
  - -usage-reporter-id=model-router
  - -i=https://raw.githubusercontent.com/aptos-labs/confidential-inference-router/v0.0.14/config.yml@sha256:672b70a850c044d7c789210f5439fddf5c712ec826bd9ceef91b0a071570e9f0
  - -u=https://raw.githubusercontent.com/aptos-labs/confidential-inference-router/v0.0.14/config.yml@sha256:672b70a850c044d7c789210f5439fddf5c712ec826bd9ceef91b0a071570e9f0
  - -d=router.inference.aptoslabs.com
  secrets:
  - USAGE_REPORTER_SECRET
  - USAGE_CONTEXT_SECRET
  - INFERENCE_DELEGATION_SECRET
  - GLM_BACKEND_API_KEY
  - METRICS_API_KEY
  healthcheck:
    test:
    - CMD
    - wget
    - -q
    - --spider
    - http://localhost:8089/health
    interval: 30s
    timeout: 10s
    start_period: 5m
  tmpfs:
    /tmp: size=256m,mode=1777,exec
